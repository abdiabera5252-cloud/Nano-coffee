<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Caffee House | Digital Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7faf5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <header class="bg-white px-4 py-3 flex justify-between items-center shadow-sm sticky top-0 z-40 border-b border-slate-100">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amber-500 flex items-center justify-center text-white font-black shadow-md border-2 border-amber-400 overflow-hidden">
                <span class="text-sm tracking-tighter">NANO</span>
            </div>
            <div>
                <h1 class="font-extrabold text-base tracking-tight text-slate-900 leading-tight">NANO CAFFEE HOUSE</h1>
                <p class="text-[11px] text-slate-400 font-medium"><i class="fa-solid fa-location-dot text-amber-600 mr-0.5"></i> Hawassa, Ethiopia</p>
            </div>
        </div>
        <button class="bg-[#10a343] text-white px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm hover:bg-[#0e8f3b] transition">
            <i class="fa-solid fa-language text-sm"></i> አማ
        </button>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4">
        
        <div class="text-center my-4">
            <h2 class="text-3xl font-black text-[#3d442a] tracking-tight">Menu</h2>
            <p class="text-xs text-slate-500 font-medium mt-1 px-4">Live menu synced directly from Google Sheets.</p>
        </div>

        <div class="relative my-4">
            <input type="text" id="search-input" onkeyup="searchMenu()" placeholder="Search items from sheet..." class="w-full bg-white py-3.5 pl-11 pr-4 rounded-2xl border border-slate-200 text-xs font-medium focus:outline-none focus:border-amber-500 shadow-sm transition">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>

        <div class="flex flex-wrap gap-2 my-4 justify-center" id="category-pills">
            <button onclick="filterCategory('all', this)" class="cat-btn bg-[#235324] text-white px-4 py-2 rounded-full text-xs font-bold shadow-sm transition">All</button>
            <button onclick="filterCategory('breakfast', this)" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-semibold shadow-sm hover:bg-slate-50 transition">Breakfast</button>
            <button onclick="filterCategory('burger', this)" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-semibold shadow-sm hover:bg-slate-50 transition">Burger & Sandwiches</button>
            <button onclick="filterCategory('desserts', this)" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-semibold shadow-sm hover:bg-slate-50 transition">Desserts</button>
        </div>

        <div id="menu-items-container" class="space-y-4">
            <div class="text-center py-10 text-xs text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-lg text-amber-600 mb-2"></i>
                <p>Loading menu items from Google Sheet...</p>
            </div>
        </div>

        <div id="track-section" class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 my-6 hidden">
            <h3 class="text-xl font-black text-[#1e3d1a] mb-2">Live Order Tracking</h3>
            <p class="text-xs text-slate-500 mb-4">Enter your order number for real-time updates.</p>
            <div class="flex gap-2">
                <input type="text" id="tracking-input" placeholder="ORD-2026-XXXX" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-medium focus:outline-none focus:border-amber-500">
                <button onclick="trackOrder()" class="bg-[#10a343] hover:bg-[#0e8f3b] text-white px-5 py-3 rounded-xl text-xs font-bold shadow-sm transition">Track</button>
            </div>
            <div id="tracking-result" class="mt-4 text-xs font-medium text-slate-600"></div>
        </div>

    </main>

    <div class="fixed bottom-20 right-4 flex flex-col gap-3 z-30">
        <button onclick="toggleWaiterModal()" class="w-12 h-12 bg-red-600 hover:bg-red-700 text-white rounded-full flex items-center justify-center shadow-lg transition transform hover:scale-105">
            <i class="fa-solid fa-bell text-sm"></i>
        </button>
        <button onclick="toggleCartModal()" class="relative w-12 h-12 bg-[#10a343] hover:bg-[#0e8f3b] text-white rounded-full flex items-center justify-center shadow-lg transition transform hover:scale-105">
            <i class="fa-solid fa-bag-shopping text-sm"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
        </button>
    </div>

    <div class="fixed bottom-20 left-4 z-30">
        <button onclick="alert('Thank you for reviewing Nano Caffee House!')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-lg transition">
            <i class="fa-solid fa-star text-amber-300"></i> Review Us
        </button>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3 px-6 flex justify-around items-center z-40 shadow-lg">
        <button onclick="switchTab('menu')" id="nav-menu" class="flex flex-col items-center text-[#235324]">
            <i class="fa-solid fa-table-cells text-base"></i>
            <span class="text-[10px] font-bold mt-1">Menu</span>
        </button>
        <button onclick="switchTab('track')" id="nav-track" class="flex flex-col items-center text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-clock text-base"></i>
            <span class="text-[10px] font-medium mt-1">Track</span>
        </button>
        <button onclick="toggleWaiterModal()" class="flex flex-col items-center text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-bell-concierge text-base"></i>
            <span class="text-[10px] font-medium mt-1">Waiter</span>
        </button>
        <button onclick="toggleCartModal()" class="flex flex-col items-center text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-basket-shopping text-base"></i>
            <span class="text-[10px] font-medium mt-1">Cart</span>
        </button>
    </nav>

    <div id="waiter-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center backdrop-blur-xs">
        <div class="bg-white w-full max-w-md max-h-[90vh] rounded-t-3xl sm:rounded-3xl p-6 flex flex-col justify-between shadow-2xl overflow-y-auto">
            <div>
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="font-extrabold text-base text-slate-900">Call a Waiter</h2>
                    <button onclick="toggleWaiterModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="my-4">
                    <label class="block text-xs font-bold text-slate-700 mb-2">Select Your Table</label>
                    <div class="grid grid-cols-3 gap-2" id="waiter-tables">
                        <button onclick="selectTableWaiter(1, this)" class="waiter-tbl bg-white border border-slate-200 py-3 rounded-xl text-xs font-bold text-[#10a343] hover:border-[#10a343]">Table 1</button>
                        <button onclick="selectTableWaiter(2, this)" class="waiter-tbl bg-white border border-slate-200 py-3 rounded-xl text-xs font-bold text-[#10a343] hover:border-[#10a343]">Table 2</button>
                        <button onclick="selectTableWaiter(3, this)" class="waiter-tbl bg-white border border-slate-200 py-3 rounded-xl text-xs font-bold text-[#10a343] hover:border-[#10a343]">Table 3</button>
                    </div>
                </div>
                <div class="my-4">
                    <label class="block text-xs font-bold text-slate-700 mb-2">What do you need?</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="selectServiceReq('Water', this)" class="srv-btn border border-slate-200 p-3 rounded-xl text-xs font-semibold text-slate-700 flex items-center gap-2"><i class="fa-solid fa-mug-hot text-amber-600"></i> Water</button>
                        <button onclick="selectServiceReq('Bill', this)" class="srv-btn border border-slate-200 p-3 rounded-xl text-xs font-semibold text-slate-700 flex items-center gap-2"><i class="fa-solid fa-receipt text-amber-600"></i> Bill</button>
                    </div>
                </div>
            </div>
            <div class="border-t pt-4 flex gap-2">
                <button onclick="toggleWaiterModal()" class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl text-xs font-bold">Close</button>
                <button onclick="submitWaiterCall()" class="flex-1 bg-red-600 text-white py-3 rounded-xl text-xs font-bold shadow-md">Call Waiter</button>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-end backdrop-blur-xs">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl overflow-y-auto">
            <div>
                <div class="flex justify-between items-center border-b pb-4">
                    <h2 class="font-extrabold text-base text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-basket-shopping text-amber-600"></i> Your Order
                    </h2>
                    <button onclick="toggleCartModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="flex justify-between items-center my-4 p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <span class="font-bold text-xs text-slate-700">Subtotal</span>
                    <span id="cart-subtotal" class="font-black text-sm text-amber-600">ETB 0.00</span>
                </div>
                <div id="cart-items-list" class="space-y-2 mb-4">
                    <p class="text-xs text-slate-400 text-center py-6">Your cart is empty</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-3 mb-4">
                    <h3 class="font-bold text-xs text-slate-800">Your Information</h3>
                    <input type="text" id="cust-name" placeholder="Name (Optional)" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-amber-500">
                    <input type="text" id="cust-phone" placeholder="Phone Number" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-amber-500">
                </div>
            </div>
            <div class="border-t pt-4 flex gap-2">
                <button onclick="toggleCartModal()" class="flex-1 bg-slate-100 text-slate-700 py-3.5 rounded-2xl text-xs font-bold">Close</button>
                <button onclick="confirmOrderWhatsApp()" class="flex-2 bg-[#10a343] text-white py-3.5 rounded-2xl text-xs font-extrabold shadow-md flex items-center justify-center gap-1.5">
                    <i class="fa-brands fa-whatsapp text-sm"></i> Confirm Order
                </button>
            </div>
        </div>
    </div>

    <script>
        let menuItems = [];
        let cart = [];
        let selectedTableWaiter = 1;
        let selectedService = 'Water';

        // REPLACE THIS URL with your published Google Sheet CSV link
        // File -> Share -> Publish to web -> Format: Comma-separated values (.csv)
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT643j-V65sTKYjMrcuHg9igQ-6T4U3FtpHub9EZB91lcbVX4gX1zNfpzhigMRgPEHk62IliUa2Ug1T/pub?gid=0&single=true&output=csv";

        // Fetch menu data on page load
        window.addEventListener('DOMContentLoaded', () => {
            fetchMenuFromSheet();
        });

        async function fetchMenuFromSheet() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error("Error loading sheet data, loading backup items:", error);
                // Fallback demo items if sheet link isn't configured yet
                menuItems = [
                    { id: 1, name: "American Pancake", category: "breakfast", price: 850, rating: 4.8, image: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?auto=format&fit=crop&w=600&q=80" },
                    { id: 2, name: "Vegetable Wrap", category: "burger", price: 900, rating: 4.0, image: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=600&q=80" }
                ];
                renderMenu(menuItems);
            }
        }

        function parseCSV(csvText) {
            const rows = csvText.split('\n').map(row => row.split(','));
            const headers = rows[0].map(h => h.trim().toLowerCase());
            
            menuItems = [];
            for (let i = 1; i < rows.length; i++) {
                if (rows[i].length < headers.length) continue;
                const rowObj = {};
                for (let j = 0; j < headers.length; j++) {
                    rowObj[headers[j]] = rows[i][j] ? rows[i][j].trim().replace(/^"|"$/g, '') : '';
                }
                if (rowObj.name) {
                    menuItems.push({
                        id: rowObj.id || i,
                        name: rowObj.name,
                        category: rowObj.category || 'all',
                        price: parseFloat(rowObj.price) || 0,
                        rating: rowObj.rating || '4.5',
                        image: rowObj.image || 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=600&q=80'
                    });
                }
            }
            renderMenu(menuItems);
        }

        function renderMenu(items) {
            const container = document.getElementById('menu-items-container');
            if (items.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-10">No items found in Google Sheet.</p>';
                return;
            }

            let html = '';
            items.forEach(item => {
                html += `
                    <div class="menu-card bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 transition" data-category="${item.category}" data-name="${item.name.toLowerCase()}">
                        <div class="relative h-48 w-full bg-slate-100">
                            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                            <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-md px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm">
                                <i class="fa-solid fa-star text-amber-400 text-xs"></i>
                                <span class="text-xs font-bold text-slate-800">${item.rating}</span>
                            </div>
                            <div class="absolute top-3 right-3 bg-amber-400 text-amber-950 font-black px-3.5 py-1 rounded-full text-xs shadow-md">
                                ETB ${item.price}
                            </div>
                        </div>
                        <div class="p-4">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-base text-[#1e3d1a]">${item.name}</h3>
                            </div>
                            <button onclick="addToOrder('${item.name}', ${item.price})" class="w-full mt-4 bg-[#10a343] hover:bg-[#0e8f3b] text-white font-bold py-3 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-sm transition">
                                <i class="fa-solid fa-plus text-sm"></i> Add to Order
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-semibold shadow-sm hover:bg-slate-50 transition";
            });
            btnElement.className = "cat-btn bg-[#235324] text-white px-4 py-2 rounded-full text-xs font-bold shadow-sm transition";

            document.querySelectorAll('.menu-card').forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function searchMenu() {
            const query = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.menu-card').forEach(card => {
                const name = card.dataset.name;
                if (name.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function switchTab(tab) {
            const trackCont = document.getElementById('track-section');
            const menuCont = document.getElementById('menu-items-container');
            const navMenu = document.getElementById('nav-menu');
            const navTrack = document.getElementById('nav-track');

            if (tab === 'track') {
                trackCont.classList.remove('hidden');
                menuCont.parentElement.style.display = 'none';
                trackCont.style.display = 'block';
                navTrack.className = "flex flex-col items-center text-[#235324]";
                navMenu.className = "flex flex-col items-center text-slate-400";
            } else {
                trackCont.classList.add('hidden');
                menuCont.parentElement.style.display = 'block';
                navMenu.className = "flex flex-col items-center text-[#235324]";
                navTrack.className = "flex flex-col items-center text-slate-400";
            }
        }

        function toggleCartModal() { document.getElementById('cart-modal').classList.toggle('hidden'); }
        function toggleWaiterModal() { document.getElementById('waiter-modal').classList.toggle('hidden'); }

        function addToOrder(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) existing.qty++;
            else cart.push({ name, price, qty: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const listEl = document.getElementById('cart-items-list');
            const subtotalEl = document.getElementById('cart-subtotal');
            let totalCount = 0, totalPrice = 0, html = '';

            cart.forEach((item, index) => {
                totalCount += item.qty;
                totalPrice += item.price * item.qty;
                html += `
                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <div>
                            <h4 class="font-bold text-xs text-slate-800">${item.name}</h4>
                            <p class="text-[10px] text-slate-500">ETB ${item.price} × ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-xs text-amber-600">ETB ${item.price * item.qty}</span>
                            <button onclick="cart.splice(${index}, 1); updateCartUI();" class="text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            badge.innerText = totalCount;
            listEl.innerHTML = html || '<p class="text-xs text-slate-400 text-center py-6">Your cart is empty</p>';
            subtotalEl.innerText = `ETB ${totalPrice}.00`;
        }

        function selectTableWaiter(num, btn) {
            selectedTableWaiter = num;
            document.querySelectorAll('.waiter-tbl').forEach(b => b.classList.remove('border-[#10a343]', 'bg-emerald-50'));
            btn.classList.add('border-[#10a343]', 'bg-emerald-50');
        }

        function selectServiceReq(srv, btn) {
            selectedService = srv;
            document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('border-amber-500'));
            btn.classList.add('border-amber-500');
        }

        function submitWaiterCall() {
            alert(`🔔 Waiter called to Table ${selectedTableWaiter} for: ${selectedService}!`);
            toggleWaiterModal();
        }

        function trackOrder() {
            const code = document.getElementById('tracking-input').value;
            const res = document.getElementById('tracking-result');
            if(!code) return res.innerHTML = '<span class="text-red-500">Please enter order number.</span>';
            res.innerHTML = `<div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-800">Order <b>${code}</b> is being prepared.</div>`;
        }

        function confirmOrderWhatsApp() {
            if (cart.length === 0) return alert('Your cart is empty!');
            const name = document.getElementById('cust-name').value || 'Guest';
            const phone = document.getElementById('cust-phone').value || 'Not provided';
            let message = `Hello Nano Caffee House, New Order:%0A*Customer:* ${name} (${phone})%0A%0A`;
            let total = 0;
            cart.forEach(item => {
                message += `- ${item.name} (x${item.qty}): ETB ${item.price * item.qty}%0A`;
                total += item.price * item.qty;
            });
            message += `%0A*Total Amount: ETB ${total}.00*`;
            window.open(`https://wa.me/251900000000?text=${message}`, '_blank');
        }
    </script>
</body>
</html>
